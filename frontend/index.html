<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asisten Risiko Karhutla Riau</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--card:#f3f3f0;--bd:#d9d9d4;--acc:#0b6b4b}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#ececec;--mut:#9a9a9a;--card:#222;--bd:#383838;--acc:#3ecf9a}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100vh}
header{padding:12px 16px;border-bottom:1px solid var(--bd)}
header h1{font-size:17px;margin:0}header small{color:var(--mut)}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.b{max-width:min(640px,90%);padding:10px 14px;border-radius:12px;line-height:1.45}
.u{align-self:flex-end;background:var(--acc);color:#fff}
.a{align-self:flex-start;background:var(--card);border:1px solid var(--bd)}
.k{align-self:flex-start;display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;background:var(--card);flex-wrap:wrap}
.lv{padding:2px 8px;border-radius:6px;font-size:13px;font-weight:600;color:#fff}
.TINGGI{background:#b3261e}.SEDANG{background:#8a5a00}.RENDAH{background:#2e6b2e}
.m{color:var(--mut);font-size:13px;align-self:flex-start}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--bd)}
input{flex:1;padding:10px 12px;font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg)}
button{padding:10px 16px;font:inherit;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
</style></head><body>
<header><h1>Asisten Risiko Karhutla Riau</h1>
<small id="info">Data demo. Skor adalah skor risiko model, bukan peluang kebakaran.</small></header>
<div id="log"></div>
<form id="f"><input id="q" placeholder="Contoh: risiko di Minas? / 5 kecamatan paling berisiko" autocomplete="off">
<button>Kirim</button></form>
<script>
const log=document.getElementById('log'),f=document.getElementById('f'),q=document.getElementById('q');
function el(tag,cls,text){const d=document.createElement(tag);d.className=cls||'';if(text!==undefined)d.textContent=text;return d}
function add(node){log.appendChild(node);log.scrollTop=log.scrollHeight;return node}
function kartu(c){const d=el('div','k');d.append(el('strong','',c.kecamatan+' ('+c.kabupaten+')'),
 el('span','','skor '+c.skor.toFixed(3)),el('span','lv '+c.level,c.level),el('span','','hotspot 7 hari: '+c.hotspot_7d));return d}
fetch('/health').then(r=>r.json()).then(h=>{document.getElementById('info').textContent=
 'Data demo tanggal '+h.tanggal+'. Skor adalah skor risiko model, bukan peluang kebakaran.'+(h.llm_aktif?'':' (LLM tidak aktif, jawaban memakai templat)')}).catch(()=>{});
f.addEventListener('submit',async e=>{e.preventDefault();const t=q.value.trim();if(!t)return;q.value='';
 add(el('div','b u',t));const w=add(el('div','b a','Memproses...'));
 try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pesan:t})});
  const d=await r.json();w.textContent=d.jawaban;(d.kartu||[]).forEach(c=>add(kartu(c)));
  add(el('div','m','Sumber kalimat: '+d.sumber+' | tanggal data: '+d.tanggal))}
 catch(err){w.textContent='Gagal menghubungi server.'}});
</script></body></html>
